<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Admin - Panti Asuhan Kuntum Teratai</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
    <style>
        :root {
            --primary-purple: #3A2C5F;
            --primary-light: #F8F5FC;
            --accent-pink: #C7156E;
            --accent-green: #2E7D32;
            --accent-gold: #D4AF37;
            --text-dark: #2D2D2D;
            --text-light: #6B6B6B;
            --white: #FFFFFF;
            --shadow-md: 0 10px 30px rgba(58, 44, 95, 0.12);
            --radius-lg: 20px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #F9F6FC 0%, #EDE6F6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: var(--text-dark);
        }

        .login-card {
            background: var(--white);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 40px 35px;
            border: 1px solid #EBE4F4;
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo {
            height: 60px;
            width: auto;
            margin: 0 auto 15px;
            display: block;
        }
        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--primary-purple);
            margin-bottom: 6px;
        }
        .login-header p {
            font-size: 0.88rem;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--primary-purple);
        }
        .input-group {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9D92B6;
            font-size: 0.95rem;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1px solid #D6CCE4;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.92rem;
            transition: var(--transition);
            background: #FCFAFE;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-pink);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(199, 21, 110, 0.12);
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9D92B6;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 0.95rem;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent-pink);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(199, 21, 110, 0.3);
            margin-top: 10px;
        }
        .btn-submit:hover:not(:disabled) {
            background: #A01058;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(199, 21, 110, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .alert-danger {
            background: #FDF2F4;
            color: #C7156E;
            border: 1px solid #F5C6D8;
        }
        .alert-warning {
            background: #FFF9E6;
            color: #996B00;
            border: 1px solid #FFE499;
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            border-top: 1px solid #EFE9F6;
            padding-top: 20px;
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .login-footer a {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }
        .login-footer a:hover {
            color: var(--accent-pink);
        }

    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <img src="Screenshot 2026-10-25 185825.png" alt="Logo Kuntum Teratai" class="login-logo">
            <h1>Portal Admin</h1>
            <p>Sistem Pengelolaan Dokumentasi Panti Asuhan</p>
        </div>

        <div id="alertBox" class="alert-box alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alertMsg">Kata sandi tidak valid. Silakan coba lagi.</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="password">Kata Sandi</label>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Lihat kata sandi">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span id="btnText"><i class="fas fa-sign-in-alt"></i> Masuk ke Dashboard</span>
                <span id="btnLoading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Memverifikasi...</span>
            </button>
        </form>

        <div class="login-footer">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Kembali ke Halaman Utama</a>
        </div>
    </div>

    <script>
        // Cek apakah sudah ada sesi aktif
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = sessionStorage.getItem('isAdminLoggedIn') === 'true' || 
                               sessionStorage.getItem('kt_admin_auth') === 'authenticated';
            if (isLoggedIn) {
                window.location.href = 'dashboard.html';
            }
        });

        // Kata sandi rahasia admin
        const ADMIN_PASSWORD = 'KuntumTeratai#2026!AdminSecured';

        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMsg');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');

            alertBox.style.display = 'none';

            const password = document.getElementById('password').value;

            btnSubmit.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';

            // Pengecekan kata sandi secara langsung (plain text match)
            setTimeout(() => {
                if (password === ADMIN_PASSWORD) {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    sessionStorage.setItem('kt_admin_auth', 'authenticated');
                    window.location.href = 'dashboard.html';
                } else {
                    alertMsg.textContent = 'Kata sandi tidak valid. Silakan coba lagi.';
                    alertBox.style.display = 'flex';
                    btnSubmit.disabled = false;
                    btnText.style.display = 'inline-block';
                    btnLoading.style.display = 'none';
                }
            }, 300);
        }
    </script>
</body>
</html>
